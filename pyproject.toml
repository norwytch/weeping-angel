[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "weeping_angel"
version = "0.1.0"
description = "Defeating timestomping malware that only acts when unobserved — a Weeping Angel framework."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Julia Quinn" }]
keywords = ["dfir", "forensics", "timestomp", "anti-forensics", "ntfs", "tamper-evident"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
]

[project.urls]
Repository = "https://github.com/norwytch/weeping-angel"

[project.scripts]
weeping-angel = "weeping_angel.cli:main"

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6"]
dev = ["pytest>=7", "hypothesis>=6", "ruff>=0.5", "mypy>=1.8", "bandit>=1.7", "pytest-cov>=4"]
# The kaggle-environments wrapper (kaggle/weeping_angel.py) is optional; its
# tests importorskip when this isn't installed, so CI stays light.
arena = ["kaggle-environments>=1.14"]

[tool.setuptools]
packages = ["weeping_angel", "weeping_angel.adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Notebooks are demo artifacts (idiomatic one-line imports, etc.), not package source.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.bandit]
# tests exercise tamper/forgery paths on purpose; scan the package only.
exclude_dirs = ["tests"]
