name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repo to lint/type-check/test.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      # Go is needed so the cross-language ledger interop test actually runs here
      # (it self-skips when the toolchain is absent); otherwise the Python<->Go
      # byte-identical-hash assertion would silently skip in CI.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: "1.26"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy weeping_angel
      - name: Security scan (bandit)
        run: bandit -r weeping_angel examples -c pyproject.toml
      - name: Test (pytest)
        run: pytest -q --cov=weeping_angel --cov-report=term-missing

  recorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: "1.26"
      - name: Vet (go vet)
        run: go -C recorder vet ./...
      - name: Test (go test)
        run: go -C recorder test ./...

  range:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
      - name: Format check
        run: terraform -chdir=range fmt -check
      - name: Init
        run: terraform -chdir=range init -backend=false
      - name: Validate
        run: terraform -chdir=range validate
